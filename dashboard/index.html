<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R&D Services Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <style>
    :root{
      --bg:#0b1220; --panel:#0f1724; --muted:#94a3b8; --accent:#2563eb;
      --card:#0d1722; --kpi-blue:#2563eb; --kpi-green:#16a34a; --kpi-orange:#f97316;
      --glass: rgba(255,255,255,0.03);
    }
    html,body{height:100%;}
    body{background:var(--bg);color:#e6eef8;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;margin:0;padding:28px;}
    .wrap{max-width:980px;margin:0 auto}
    .title{text-align:center;margin-bottom:18px}
    .title h1{margin:0;font-size:30px;font-weight:700}
    .subtitle{color:var(--muted);font-size:13px;margin-top:6px}

    .kpis{display:flex;gap:12px;margin:18px 0}
    .kpi{flex:1;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);border:1px solid rgba(255,255,255,0.03);padding:18px;border-radius:10px;display:flex;align-items:center;gap:12px}
    .kpi .icon{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
    .kpi .meta{flex:1}
    .kpi .label{color:var(--muted);font-size:12px}
    .kpi .value{font-size:22px;font-weight:700;margin-top:6px}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .panel{background:var(--panel);padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
    .panel h3{margin:0;font-size:14px;color:#cfe6ff}
    .legend{font-size:12px;color:var(--muted);margin-top:8px}

    .bottom{margin-top:12px}
    .full{grid-column:1/-1}

    .export{display:flex;justify-content:center;margin-top:14px}
    .btn{background:#0b6efd;color:white;padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:600}

    /* chart canvas sizing */
    canvas{width:100% !important;height:260px !important}
    .small{font-size:12px;color:var(--muted)}

    @media (max-width:880px){.kpis{flex-direction:column}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap" id="dashboardRoot">
    <div class="title">
      <h1>R&D Services Dashboard</h1>
      <div class="subtitle">Service Performance Overview</div>
    </div>

    <div class="kpis">
      <div class="kpi">
        <div class="icon" style="background:#1157d1">📩</div>
        <div class="meta">
          <div class="label">Total Tickets</div>
          <div class="value" id="k_totalTickets">—</div>
          <div class="small">All Services</div>
        </div>
      </div>

      <div class="kpi">
        <div class="icon" style="background:#0ea5a4">⏱️</div>
        <div class="meta">
          <div class="label">Total Saving Hours</div>
          <div class="value" id="k_totalHours">—</div>
          <div class="small">Hours</div>
        </div>
      </div>

      <div class="kpi">
        <div class="icon" style="background:#f97316">📈</div>
        <div class="meta">
          <div class="label">Total Savings (Week)</div>
          <div class="value" id="k_weeklySavings">—</div>
          <div class="small">Hours / Week</div>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <h3>Number of Tickets by Service Category</h3>
        <canvas id="pieChart"></canvas>
        <div class="legend" id="pieLegend"></div>
      </div>

      <div class="panel">
        <h3>Saving Hours by Service Category</h3>
        <canvas id="barChart"></canvas>
      </div>

      <div class="panel full">
        <h3>Savings (Week) by Service Category</h3>
        <canvas id="hbarChart" style="height:160px !important"></canvas>
      </div>
    </div>

    <div class="export">
      <button class="btn" id="exportBtn">Export PNG</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    const SAMPLE_URL = 'sample-data.json';
    const FALLBACK = {categories:['Project Coordination','Testing','Documentation'],ticketsPerCategory:[313,4,13],savingHoursPerService:[3003.5,914,4643],weeklyLabels:['Project Coordination','Testing','Documentation'],weeklySavings:[79,24,122]};

    async function loadData(){
      try{
        const r = await fetch(SAMPLE_URL);
        if(!r.ok) throw new Error('no');
        return await r.json();
      }catch(e){return FALLBACK}
    }

    function sum(a){return a.reduce((s,x)=>s+(+x||0),0)}

    function formatNumber(v){if(Math.abs(v)>=1000) return v.toLocaleString(); return v}

    document.addEventListener('DOMContentLoaded', async ()=>{
      const data = await loadData();
      // map incoming arrays: if savingHoursPerService exists as large numbers use it; weeklySavings may be per-week small numbers
      const categories = data.categories || FALLBACK.categories;
      const tickets = data.ticketsPerCategory || FALLBACK.ticketsPerCategory;
      const hours = data.savingHoursPerService || FALLBACK.savingHoursPerService;
      const weekly = data.weeklySavings || FALLBACK.weeklySavings;

      // KPIs
      const totalTickets = sum(tickets);
      const totalHours = Math.round(sum(hours)*10)/10;
      const weeklyTotal = sum(weekly);
      document.getElementById('k_totalTickets').innerText = totalTickets.toLocaleString();
      document.getElementById('k_totalHours').innerText = totalHours.toLocaleString();
      document.getElementById('k_weeklySavings').innerText = weeklyTotal.toLocaleString();

      // Pie chart
      const pieCtx = document.getElementById('pieChart');
      const pie = new Chart(pieCtx, {
        type:'doughnut',
        data:{labels:categories,datasets:[{data:tickets,backgroundColor:['#2563eb','#16a34a','#f97316']} ]},
        options:{plugins:{legend:{display:false},datalabels:{display:true,formatter:(v,ctx)=>{const sumv=sum(ctx.chart.data.datasets[0].data);return Math.round(v/sumv*100)+"%";},color:'#fff',font:{weight:'700'}}},cutout:'60%'}
      });

      // Pie legend text
      const legend = document.getElementById('pieLegend');
      legend.innerHTML = categories.map((c,i)=>`<div style="margin-top:6px"><span style="display:inline-block;width:12px;height:12px;background:${['#2563eb','#16a34a','#f97316'][i]};margin-right:8px;border-radius:2px"></span>${c} (${tickets[i]})</div>`).join('');

      // Vertical bar hours
      const barCtx = document.getElementById('barChart');
      new Chart(barCtx,{type:'bar',data:{labels:categories,datasets:[{label:'Saving Hours',data:hours,backgroundColor:['#2563eb','#16a34a','#f97316']}]},options:{plugins:{datalabels:{anchor:'end',align:'end',color:'#fff',formatter:(v)=>formatNumber(v)}},scales:{y:{beginAtZero:true}},maintainAspectRatio:false}});

      // Horizontal bar weekly
      const hbarCtx = document.getElementById('hbarChart');
      new Chart(hbarCtx,{type:'bar',data:{labels:categories,datasets:[{label:'Savings (Week)',data:weekly,backgroundColor:['#2563eb','#16a34a','#f97316']}]},options:{indexAxis:'y',plugins:{legend:{display:false},datalabels:{anchor:'end',align:'right',color:'#fff',formatter:(v)=>v}},scales:{x:{beginAtZero:true}},maintainAspectRatio:false}});

      // Export button
      document.getElementById('exportBtn').addEventListener('click', async ()=>{
        const root = document.getElementById('dashboardRoot');
        const canvas = await html2canvas(root,{backgroundColor: null,scale:2});
        const url = canvas.toDataURL('image/png');
        const a = document.createElement('a'); a.href = url; a.download = 'RnD_Services_Dashboard.png'; a.click();
      });
    });
  </script>
</body>
</html>
