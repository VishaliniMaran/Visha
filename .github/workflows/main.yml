<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>R&D Services Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body class="dark">
  <div class="wrap">
    <header class="hdr">
      <h1>R&D Services Dashboard</h1>
      <p class="sub">Service Performance Overview</p>
    </header>

    <section class="kpis">
      <div class="kpi">
        <div class="kpi-icon">📥</div>
        <div class="kpi-body">
          <div class="kpi-value" id="kpiTickets">-</div>
          <div class="kpi-label">Total Tickets</div>
        </div>
      </div>

      <div class="kpi">
        <div class="kpi-icon">⏱️</div>
        <div class="kpi-body">
          <div class="kpi-value" id="kpiHours">-</div>
          <div class="kpi-label">Total Saving Hours</div>
        </div>
      </div>

      <div class="kpi">
        <div class="kpi-icon">📈</div>
        <div class="kpi-body">
          <div class="kpi-value" id="kpiWeeks">-</div>
          <div class="kpi-label">Total Savings (Week)</div>
        </div>
      </div>
    </section>

    <section class="charts">
      <div class="chart-card">
        <h4 class="chart-title">Tickets by Category</h4>
        <canvas id="ticketsChart"></canvas>
      </div>

      <div class="chart-card">
        <h4 class="chart-title">Saving Hours by Category</h4>
        <canvas id="hoursChart"></canvas>
      </div>

      <div class="chart-card wide">
        <h4 class="chart-title">Savings (Week) by Category</h4>
        <canvas id="weeksChart"></canvas>
      </div>
    </section>

    <section class="controls">
      <button id="exportPdfBtn">Export PDF</button>
    </section>

    <footer class="ftr">Dashboard generated • Minimal view</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>

/* Dark minimal dashboard styling */
:root{--bg:#0b1620;--card:#0f1724;--muted:#9aa3ad;--accent:#2fb6ff;--accent2:#ff8a2b;--green:#3ac47d}
*{box-sizing:border-box}
body.dark{background:linear-gradient(180deg,#061018 0%, #081822 100%);color:var(--muted);font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;margin:0}
.wrap{max-width:1100px;margin:24px auto;padding:18px}
.hdr{text-align:center;margin-bottom:14px}
.hdr h1{color:#ffffff;margin:0;font-size:30px;letter-spacing:0.6px}
.hdr .sub{margin:6px 0 0;color:var(--muted)}

.kpis{display:flex;gap:14px;justify-content:space-between;margin:18px 0}
.kpi{background:var(--card);flex:1;padding:14px;border-radius:10px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
.kpi-icon{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#0b2030, #112734);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.kpi-body{flex:1}
.kpi-value{font-size:26px;color:#fff;font-weight:700}
.kpi-label{font-size:12px;color:var(--muted);margin-top:6px}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chart-card{background:var(--card);padding:14px;border-radius:12px;box-shadow:0 8px 22px rgba(2,6,23,0.6)}
.chart-card.wide{grid-column:1/-1}
.chart-title{color:var(--muted);font-size:14px;margin:0 0 8px}
canvas{width:100% !important;height:320px !important}

.controls{display:flex;justify-content:center;margin:16px 0}
.controls button{background:linear-gradient(90deg,var(--accent),#1fb6ff);color:#021018;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600}

.ftr{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}

@media(max-width:900px){.kpis{flex-direction:column}.charts{grid-template-columns:1fr}.kpi{width:100%}}

// Minimal dashboard script (sample data baked in)
const data = {
  servicesSummary: [
    { category: 'Project Coordination', numServices: 23, tickets: 313, totalEngSavingHrs: 3003.5, totalEngSavingWks: 79 },
    { category: 'Testing', numServices: 4, tickets: 40, totalEngSavingHrs: 914, totalEngSavingWks: 24 },
    { category: 'Documentation', numServices: 13, tickets: 596, totalEngSavingHrs: 4643, totalEngSavingWks: 122 }
  ],
  totals: { numServices: 40, tickets: 949, totalEngSavingHrs: 8561, totalEngSavingWks: 225 }
};

function formatNumber(v){
  if (Number.isInteger(v)) return v.toString();
  return v.toLocaleString(undefined, { maximumFractionDigits: 1 });
}

function init(){
  document.getElementById('kpiTickets').textContent = formatNumber(data.totals.tickets);
  document.getElementById('kpiHours').textContent = formatNumber(data.totals.totalEngSavingHrs);
  document.getElementById('kpiWeeks').textContent = formatNumber(data.totals.totalEngSavingWks);

  const colors = ['#2f7ef7','#28c76f','#ff9800'];

  // Tickets doughnut
  const tCtx = document.getElementById('ticketsChart').getContext('2d');
  new Chart(tCtx, {
    type: 'doughnut',
    data: { labels: data.servicesSummary.map(s => s.category), datasets: [{ data: data.servicesSummary.map(s => s.tickets), backgroundColor: colors }] },
    options: { plugins: { legend: { display: true, labels: { color: '#9aa3ad' } } } }
  });

  // Saving hours bar
  const hCtx = document.getElementById('hoursChart').getContext('2d');
  new Chart(hCtx, {
    type: 'bar',
    data: { labels: data.servicesSummary.map(s => s.category), datasets: [{ data: data.servicesSummary.map(s => s.totalEngSavingHrs), backgroundColor: colors }] },
    options: { scales: { y: { ticks: { color: '#9aa3ad' }, beginAtZero: true }, x: { ticks: { color: '#9aa3ad' } } }, plugins: { legend: { display: false } } }
  });

  // Weeks horizontal bar
  const wCtx = document.getElementById('weeksChart').getContext('2d');
  new Chart(wCtx, {
